<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        无序标签：ul>li
        有序标签：ol>li
        自定义标签：dl>dh>dd
    -->
        <ul>
            <li>列表1</li>
            <li>列表2</li>
            <li>列表3</li>
        </ul>
        <ol>
            <li>中国</li>
            <li>美国</li>
            <li>德国</li>
        </ol>
        <dl>
            <dt>成都</dt>
            <dd>武侯区</dd>
            <dd>金牛</dd>
            <dd>天府</dd>
            <dt>眉山</dt>
            <dd>东坡</dd>
            <dd>彭山</dd>
            <dd>青神</dd>
        </dl>
</body>
</html>
