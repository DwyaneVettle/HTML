<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 加粗：b或strong标签 -->
    <b>注意：今天是疯狂星期四，肯德基半价</b>
    <br>
    <strong id="abc">注意：今天是疯狂星期四，肯德基半价</strong>
    <br>
    <!-- 倾斜：em或i标签 -->
     <em>注意：今天是疯狂星期四，肯德基半价</em>
     <br>
     <i>注意：今天是疯狂星期四，肯德基半价</i>

     <br>
     <!-- 删除线：del或s标签 -->
      <del>注意：今天是疯狂星期四，肯德基半价</del>
      <br>
      <s>注意：今天是疯狂星期四，肯德基半价</s>
      <br>

      <!-- 下划线：ins或u标签 -->
       <ins>注意：今天是疯狂星期四，肯德基半价</ins>
       <br>
       <u>注意：今天是疯狂星期四，肯德基半价</u>

       <!-- 分隔线 -->
       <hr>


       <!-- 
       表示装内容，可以看作一个盒子
        div：大盒子，独占一行，表示分隔
        span：小盒子，多个占一行，表示间距
       -->
        <div>大盒子</div>
        <div>大盒子</div>
        <div>大盒子</div>
        <span>小盒子</span>
        <span>小盒子</span>
        <span>小盒子</span>

        <hr>

        <!-- 
            image标签：图像标签
            属性：
                src:source，是引入图像的URL地址
                alt：当图片不显示时，提示文本
                title:当鼠标移动到图片上提示的文本
                width、height:表示图像的宽高
                border:图像的边框-像素 线条的类型 颜色
        -->

        <!-- 绝对路径 -->
        <!-- <img src="https://vcg00.cfp.cn/cms/image/image/d1aa4b5b80824d04b7c32a6e4c4d10ce.jpg" alt=""> -->

        <!-- 相对地址: 相对于当前html文件,图片的存放位置 -->
         <!-- <img src="D:\1.jpg" alt=""> -->
         <img src="imgs/1.jpg" alt="服务器出错了!"
          title="这是一张图片" width="50%" height="50%"
         >

         <hr>

         <!-- 
            超链接标签:a
            属性:
                1.href:必有属性,表示页面跳转的url
                2.target:表示页面的跳转方式,默认self当前页面跳转,blank新的页面跳转

         -->
        <!-- 外部链接 -->
        <a href="https://www.baidu.com" target="_blank">百度一下</a>
        <!-- 内部链接 -->
         <a href="demo.html">跳转到demo</a>
         <!-- 空链接 -->
          <a href="#">没有跳转</a>
        <!-- 下载文件:当href中是文件或者压缩包,就自动下载 -->
         <a href="demo.zip">下载图片</a>
        <!-- 跳转到本页面中的特定位置 -->
         <a href="#abc">回到上面</a>
</body>
</html>
