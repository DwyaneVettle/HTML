<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        表格标签：
            table：表示表格的格式
            tr:表示单元行，有几行就有几对tr
            td:表示单元格/列
            table>tr>td
            th:表格头，加粗居中显示

    -->
        <h6 align="center">个人信息表</h6>
        <table border="1" align="center" cellspacing="0"
                width="50%">
            <tr>
                <th>姓名</th>
                <th>性别</th>
                <th>电话</th>
            </tr>
            <tr>
                <td>小王</td>
                <td>女</td>
                <td>110</td>
            </tr>
            <tr>
                <td>小明</td>
                <td>男</td>
                <td>120</td>
            </tr>
        </table>
</body>
</html>
