<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        列表标签：
        1.无序标签：ul>li
        2.有序标签：ol>li
        3.自定义标签：dl>dt>dd
    -->
        <!-- 无序标签 -->
         <ul>
            <li>列表1</li>
            <li>列表1</li>
            <li>列表3</li>
         </ul>
         <!-- 有序标签 -->
          <ol>
            <li>广东</li>
            <li>江苏</li>
            <li>山东</li>
          </ol>
          <!-- 自定义标签 -->
           <dl>
                <dt>四川</dt>
                <dd>成都</dd>
                <dd>眉山</dd>
                <dd>绵阳</dd>
                <dd>宜宾</dd>
           </dl>
           <dl>
                <dt>广东</dt>
                <dd>广州</dd>
                <dd>深圳</dd>
                <dd>珠海</dd>
                <dd>汕头</dd>
           </dl>
</body>
</html>
