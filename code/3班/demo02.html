<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        表格标签：
            table:表示表格格式
            tr:表格的但远航，有几行就有几对tr
            td:单元格中的数据

    -->
       <h6 align="center">个人信息表</h6>  
       <table border="1" align="center" cellspadding="5px" 
                cellspacing="0px" width="50%">
            <tr width="60px">
                <th>姓名</th>
                <th>性别</th>
                <th>电话</th>
            </tr>
            <tr>
                <td>小王</td>
                <td>女</td>
                <td>110</td>
            </tr>
            <tr>
                <td>小明</td>
                <td>男</td>
                <td>120</td>
            </tr>
       </table>   
</body>
</html>
