<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        合并单元格：
            1.合并行：rowspan
            2.合并列：colspan
1. 先确定跨行还是跨列合并；
2. 找到目标单元格，写上合并方式=合并单元格数量。如：<td colspan="2"></td>；
3. 删除多余单元格。
    -->
    <table border="1" cellspacing="0" align="center"
        width="50%">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td colspan="2">2</td>
            
        </tr>
        <tr>
            <!-- <td>1</td> -->
            <td>2</td>
            <td>3</td>
        </tr>
    </table>
</body>
</html>
